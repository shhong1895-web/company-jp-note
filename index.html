<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>회사 일본어 노트</title>

<style>
  :root{
    --ink:#1E2A38; --washi:#F3EEE3; --washi-dark:#E7DFCE; --hanko:#B23A2E;
    --hanko-soft:#E7C9C4; --sage:#4C6B5A; --ink-soft:#5B564C; --amber:#B8862E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--washi);color:var(--ink);font-family:'Noto Sans KR',sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;min-height:100dvh;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .hidden{display:none !important;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 90px;}
  header.top{border-bottom:2px solid var(--ink);padding:20px 18px 14px;}
  .brand-jp{color:var(--hanko);letter-spacing:2px;font-size:11px;font-weight:700;margin:0 0 2px;}
  .brand-ko{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;margin:0;}
  .rowbetween{display:flex;justify-content:space-between;align-items:center;}
  .stamp{border:2px solid var(--hanko);color:var(--hanko);border-radius:6px;width:56px;height:56px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .stamp span{font-size:14px;font-weight:700;line-height:1;margin-top:2px;}
  .progress-badge{border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;margin-top:14px;}
  .progress-dot{flex:1;height:14px;border:1.5px solid var(--washi-dark);border-radius:3px;}
  .progress-dot.filled{border-color:var(--hanko);background:var(--hanko);}
  nav.tabs{max-width:640px;margin:14px auto 0;padding:0 18px;display:flex;gap:2px;flex-wrap:wrap;}
  .tab-btn{background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:13px;
    padding:8px 10px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:5px;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--hanko);}
  main{max-width:640px;margin:0 auto;padding:20px 18px 60px;}

    display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* =========================================================

/* =========================================================
   2. 유틸
========================================================= */
function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}
function similarity(a, b) {
  const A = (a || "").replace(/\s/g, "");
  const B = (b || "").replace(/\s/g, "");
  if (!A.length && !B.length) return 100;
  const dist = levenshtein(A, B);
  const maxLen = Math.max(A.length, B.length, 1);
  return Math.max(0, Math.round((1 - dist / maxLen) * 100));
}
function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toast(msg, ms = 2800) {
  const root = document.getElementById("toast-root");
  const elx = document.createElement("div");
  elx.className = "toast";
  elx.textContent = msg;
  root.appendChild(elx);
  setTimeout(() => elx.remove(), ms);
}
function kanjiRowHtml(word, size = 64) {
  const px = size;
  const fontPx = Math.round(size * 0.52);
  return `<div class="kanji-row">${word.split("").map(ch =>
    `<div class="kanji-cell" style="width:${px}px;height:${px}px;"><span style="font-size:${fontPx}px;">${escapeHtml(ch)}</span></div>`
  ).join("")}</div>`;
}
function progressLabel(unlocked) {
  if (unlocked <= 20) return "N5 수준";
  if (unlocked <= 40) return "N4 수준";
  if (unlocked <= 60) return "N3 수준";
  if (unlocked <= 80) return "N2 수준";
  return "N1 수준";
}

/* =========================================================
   3-0. 히라가나 가상 키보드 (기기에 일본어 키보드 없어도 입력 가능)
========================================================= */
const HIRA_ROWS = [
  ["あ","い","う","え","お"], ["か","き","く","け","こ"], ["さ","し","す","せ","そ"],
  ["た","ち","つ","て","と"], ["な","に","ぬ","ね","の"], ["は","ひ","ふ","へ","ほ"],
  ["ま","み","む","め","も"], ["や","","ゆ","","よ"], ["ら","り","る","れ","ろ"],
  ["わ","","を","","ん"], ["が","ぎ","ぐ","げ","ご"], ["ざ","じ","ず","ぜ","ぞ"],
  ["だ","ぢ","づ","で","ど"], ["ば","び","ぶ","べ","ぼ"], ["ぱ","ぴ","ぷ","ぺ","ぽ"],
  ["っ","ゃ","ゅ","ょ","ー"]
];
function hiraganaKeyboardHtml(inputId) {
  const rows = HIRA_ROWS.map(row => `
    <div style="display:flex;gap:3px;margin-bottom:3px;">
      ${row.map(ch => ch
        ? `<button type="button" onclick="insertHiragana('${inputId}','${ch}')" style="flex:1;padding:6px 0;font-size:14px;border:1px solid var(--washi-dark);border-radius:3px;background:#fff;">${ch}</button>`
        : `<div style="flex:1;"></div>`
      ).join("")}
    </div>`).join("");
  return `
    <div style="margin-top:8px;">
      ${rows}
      <div style="display:flex;gap:6px;margin-top:4px;">
        <button type="button" onclick="insertHiragana('${inputId}',' ')" style="flex:2;padding:6px 0;font-size:12px;border:1px solid var(--washi-dark);border-radius:3px;background:#fff;">공백</button>
        <button type="button" onclick="backspaceInput('${inputId}')" style="flex:1;padding:6px 0;font-size:12px;border:1px solid var(--washi-dark);border-radius:3px;background:#fff;">⌫</button>
      </div>
    </div>`;
}
function insertHiragana(inputId, ch) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const start = inp.selectionStart ?? inp.value.length;
  const end = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, start) + ch + inp.value.slice(end);
  const pos = start + ch.length;
  inp.focus(); inp.setSelectionRange(pos, pos);
}
function backspaceInput(inputId) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const start = inp.selectionStart ?? inp.value.length;
  const end = inp.selectionEnd ?? inp.value.length;
  if (start === end && start > 0) { inp.value = inp.value.slice(0, start - 1) + inp.value.slice(end); inp.setSelectionRange(start - 1, start - 1); }
  else { inp.value = inp.value.slice(0, start) + inp.value.slice(end); inp.setSelectionRange(start, start); }
  inp.focus();
}

/* =========================================================
   3. TTS
========================================================= */
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP";
  utter.rate = 0.95;
  const voices = window.speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang && v.lang.startsWith("ja"));
  if (jaVoice) utter.voice = jaVoice;
  window.speechSynthesis.speak(utter);
}

/* =========================================================
   3-1. 발음 연습: SpeechRecognition 지원 시 자동 채점,
   미지원(iOS Safari 등)이면 녹음+재생으로 자동 대체
   -> iOS Safari는 SpeechRecognition을 지원하지 않아 "동작 안 함"으로 보였던 부분
========================================================= */
const SR_SUPPORTED = typeof window !== "undefined" && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
const MR_SUPPORTED = typeof window !== "undefined" && !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

function listenPronunciation(onResult, onError) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "ja-JP";
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.onerror = (e) => onError("음성 인식 오류: " + e.error);
  rec.onresult = (e) => {
    const alts = [];
    for (let i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
    onResult(alts);
  };
  rec.start();
}

let mediaRecorder = null, recordedChunks = [];
async function startRecording(onReady, onError) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: "audio/webm" });
      onReady(URL.createObjectURL(blob));
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
  } catch (e) {
    onError("마이크 권한이 필요해요. 브라우저 설정에서 마이크 접근을 허용해주세요.");
  }
}
function stopRecording() { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); }

function setupListeners() {
  db.collection("sharedWords").onSnapshot(snap => {
    const custom = [];
    snap.forEach(d => custom.push({ id: d.id, ...d.data() }));
    S.words = custom.length ? custom : [...DEFAULT_WORDS];
    if (["study", "quiz", "write", "admin"].includes(S.tab)) renderTab();
  }, err => console.error("sharedWords listener", err));

  db.collection("progress").doc(S.uid).onSnapshot(doc => {
    if (doc.exists) { S.progress = { masteredCount: 0, dailyWordCount: 3, ...doc.data() }; renderProgressBadge(); if (S.tab === "study" || S.tab === "daily") renderTab(); }
  }, err => console.error("progress listener", err));

  db.collection("progress").doc(S.uid).collection("wordStats").onSnapshot(snap => {
    const map = {};
    snap.forEach(d => map[d.id] = d.data());
    S.wordStats = map;
    if (S.tab === "record") renderTab();
  }, err => console.error("wordStats listener", err));

  if (S.user.role === "leader" || S.user.role === "director") {
    const progressQuery = S.user.role === "director"
      ? db.collection("progress")
      : db.collection("progress").where("team", "==", S.user.team);
    progressQuery.onSnapshot(snap => {
      const list = [];
      snap.forEach(d => list.push({ uid: d.id, ...d.data() }));
      S.team = list;
      if (S.tab === "team") renderTab();
    }, err => console.error("team listener", err));

    const rosterQuery = S.user.role === "director"
      ? db.collection("roster")
      : db.collection("roster").where("team", "==", S.user.team);
    rosterQuery.onSnapshot(snap => {
      const list = [];
      snap.forEach(d => list.push({ empId: d.id, ...d.data() }));
      S.roster = list;
      if (S.tab === "admin") renderTab();
    }, err => console.error("roster listener", err));
  }
}

async function markActivity({ quizPct } = {}) {
  const ref = db.collection("progress").doc(S.uid);
  await db.runTransaction(async (t) => {
    const doc = await t.get(ref);
    const data = doc.exists ? doc.data() : {};
    const today = todayStr(); const yesterday = todayStr(-1);
    let streak = data.streak || 0;
    const last = data.lastStudyDate;
    if (last === today) { /* 이미 카운트됨 */ }
    else if (last === yesterday) { streak += 1; }
    else { streak = 1; }
    const patch = {
      lastStudyDate: today, streak, name: S.user.name, empId: S.user.empId,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (typeof quizPct === "number") {
      patch.quizCount = (data.quizCount || 0) + 1;
      patch.quizAccSum = (data.quizAccSum || 0) + quizPct;
    }
    t.set(ref, patch, { merge: true });
  });
}
function bumpWordStat(wordId, patch) {
  db.collection("progress").doc(S.uid).collection("wordStats").doc(wordId).set(patch, { merge: true }).catch(e => console.error(e));
}

/* =========================================================
   8-1. 오늘의 학습 탭 (읽기=말하기 평가, 쓰기=키보드 타이핑, 말하기=예문, 마지막 퀴즈로 완료)
========================================================= */
function ensureDailySession() {
  const today = todayStr();
  if (S.progress.daily && S.progress.daily.date === today) return;
  const batch = todaysBatchWords();
  const daily = { date: today, wordIds: batch.map(w => w.id), perWord: {}, completed: false };
  batch.forEach(w => { daily.perWord[w.id] = { listen: 0, speakPass: 0, typePass: 0 }; });
  S.progress.daily = daily;
  db.collection("progress").doc(S.uid).set({ daily }, { merge: true }).catch(e => console.error(e));
}
function setDailyWordCount(n) {
  db.collection("progress").doc(S.uid).set({ dailyWordCount: n }, { merge: true });
  toast("하루 학습 단어 수를 " + n + "개로 설정했어요. (진행 중인 오늘 학습이 없을 때부터 적용돼요)");
}
function incrementDailyStep(wordId, field) {
  const daily = S.progress.daily;
  if (!daily || daily.date !== todayStr()) return;
  const p = daily.perWord[wordId] || { listen: 0, speakPass: 0, typePass: 0 };
  p[field] = Math.min(3, (p[field] || 0) + 1);
  daily.perWord[wordId] = p;
  db.collection("progress").doc(S.uid).set({ daily }, { merge: true }).catch(e => console.error(e));
  renderDailyTab(document.getElementById("tab-content"));
}
function dailyAllStepsDone() {
  const daily = S.progress.daily;
  if (!daily) return false;
  return daily.wordIds.every(id => {
    const p = daily.perWord[id] || {};
    return (p.listen || 0) >= 3 && (p.speakPass || 0) >= 3 && (p.typePass || 0) >= 3;
  });
}
function completeDailySession() {
  const daily = S.progress.daily;
  const addCount = daily ? daily.wordIds.length : (S.progress.dailyWordCount || 3);
  const newMastered = (S.progress.masteredCount || 0) + addCount;
  db.collection("progress").doc(S.uid).set({
    masteredCount: newMastered,
    daily: { date: todayStr(), wordIds: [], perWord: {}, completed: true }
  }, { merge: true }).then(() => toast("오늘 학습을 완료했어요! 내일 새로운 단어를 만나요 🎉"));
}
function renderDailyTab(c) {
  ensureDailySession();
  const daily = S.progress.daily;
  const dailyCount = S.progress.dailyWordCount || 3;
  let html = `
    <div class="card" style="margin-bottom:14px;">
      <div class="rowbetween">
        <p style="font-weight:700;margin:0;">하루 학습 단어 수</p>
        <div style="display:flex;gap:6px;">
          <button class="btn-ghost" style="padding:4px 10px;${dailyCount === 3 ? "background:var(--ink);color:var(--washi);" : ""}" onclick="setDailyWordCount(3)">3개</button>
          <button class="btn-ghost" style="padding:4px 10px;${dailyCount === 5 ? "background:var(--ink);color:var(--washi);" : ""}" onclick="setDailyWordCount(5)">5개</button>
        </div>
      </div>
    </div>
  `;
  if (S.quiz && S.quiz.isDaily) {
    if (S.quiz.idx >= S.quiz.questions.length) { renderQuizResult(document.getElementById("tab-content")); return; }
    document.getElementById("tab-content").innerHTML = html + quizQuestionCardHtml();
    return;
  }
  if (daily && daily.completed) {
    c.innerHTML = html + `
      <div class="card-soft">
        <p style="font-size:20px;font-weight:700;margin:0;">오늘 학습 완료! 🎉</p>
        <p class="muted small" style="margin-top:6px;">내일 새로운 단어로 다시 만나요. 지금은 '자유학습'이나 '퀴즈' 탭에서 자유롭게 복습할 수 있어요.</p>
      </div>`;
    return;
  }
  if (!daily || !daily.wordIds.length) {
    c.innerHTML = html + `<div class="card-soft"><p class="muted small">🎉 등록된 단어를 모두 학습했어요! 관리 탭에서 새 단어를 더 등록해달라고 요청해보세요.</p></div>`;
    return;
  }
  const words = daily.wordIds.map(id => S.words.find(w => w.id === id)).filter(Boolean);
  html += words.map(w => dailyWordCardHtml(w, daily.perWord[w.id] || { listen: 0, speakPass: 0, typePass: 0 })).join("");
  if (dailyAllStepsDone()) {
    html += `<div class="card-soft" style="margin-top:14px;"><p style="font-weight:700;margin:0 0 10px;">오늘의 단어를 모두 연습했어요!</p><button class="btn-hanko" onclick="startDailyQuiz()">퀴즈로 오늘 학습 마무리하기</button></div>`;
  } else {
    html += `<p class="muted small center" style="margin-top:10px;">각 단어의 듣기·말하기·쓰기를 3번씩 완료하면 마무리 퀴즈가 열려요.</p>`;
  }
  c.innerHTML = html;
}

      <button class="btn-main" style="width:100%;margin-top:8px;" onclick="dailyType('${w.id}','${escapeHtml(w.reading)}')">채점하기</button>

function dailyListen(wordId, kanji) { speak(kanji); incrementDailyStep(wordId, "listen"); }
function dailySpeak(wordId, reading, kanji) {
  const resultBox = document.getElementById(`daily-speak-result-${wordId}`);
  if (!SR_SUPPORTED) {
    if (!MR_SUPPORTED) { resultBox.innerHTML = `<p class="muted small">이 브라우저에서는 말하기 연습을 사용할 수 없어요.</p>`; return; }
    resultBox.innerHTML = `<p class="muted small">🔴 녹음 중... (다시 누르면 정지)</p>`;
    const btn = document.getElementById(`daily-speak-btn-${wordId}`);
    btn.onclick = () => { stopRecording(); btn.onclick = () => dailySpeak(wordId, reading, kanji); };
    startRecording(
      (audioUrl) => {
        resultBox.innerHTML = `
          <p class="muted small">자동 채점 미지원 브라우저예요. 비교해보고 잘 됐으면 완료를 눌러주세요.</p>
          <audio controls src="${audioUrl}"></audio>
          <button class="btn-sage" style="width:100%;margin-top:6px;" onclick="incrementDailyStep('${wordId}','speakPass');toast('말하기 완료로 기록했어요!')">비교 후 완료</button>
        `;
      },
      (errMsg) => { resultBox.innerHTML = `<p class="muted small">${escapeHtml(errMsg)}</p>`; }
    );
    return;
  }
  resultBox.innerHTML = `<p class="muted small">듣고 있어요...</p>`;
  listenPronunciation(
    (alts) => {
      let best = 0;
      alts.forEach(a => { best = Math.max(best, similarity(a, reading), similarity(a, kanji)); });
      const cur = S.wordStats[wordId] || { pronAttempts: 0, pronScoreSum: 0 };
      bumpWordStat(wordId, { pronAttempts: (cur.pronAttempts || 0) + 1, pronScoreSum: (cur.pronScoreSum || 0) + best });
      const color = best >= 80 ? "var(--sage)" : "var(--hanko)";
      resultBox.innerHTML = `<p class="small" style="color:${color};font-weight:700;">${best}점 ${best >= 80 ? "- 통과! ✅" : "- 80점 이상이 필요해요"}</p>`;
      if (best >= 80) incrementDailyStep(wordId, "speakPass");
    },
    (errMsg) => { resultBox.innerHTML = `<p class="muted small">${escapeHtml(errMsg)}</p>`; }
  );
}
function dailyType(wordId, reading) {
  const val = document.getElementById(`daily-type-input-${wordId}`).value.trim();
  const score = similarity(val, reading);
  const correct = score >= 80;
  const box = document.getElementById(`daily-type-result-${wordId}`);
  box.innerHTML = `<p class="small" style="color:${correct ? "var(--sage)" : "var(--hanko)"};font-weight:700;">${correct ? "정답이에요! ✅" : "다시 확인해보세요. 정답: " + escapeHtml(reading)}</p>`;
  if (correct) incrementDailyStep(wordId, "typePass");
}
function startDailyQuiz() {
  const daily = S.progress.daily;
  const todayWords = daily.wordIds.map(id => S.words.find(w => w.id === id)).filter(Boolean);
  const reviewPool = masteredWords();
  const reviewSample = shuffle(reviewPool).slice(0, Math.min(5, reviewPool.length));
  const total = Math.max(todayWords.length + reviewSample.length, todayWords.length);
  S.quiz = { questions: buildQuiz([...todayWords, ...reviewSample, ...unlockedWords()], total, todayWords), idx: 0, score: 0, selected: null, isDaily: true };
  renderDailyTab(document.getElementById("tab-content"));
}

/* =========================================================
   9. 학습 탭 (난이도 오름차순 정렬, 잠금 해제 범위 내에서만)
========================================================= */
function sortedWords() { return [...S.words].sort((a, b) => (a.difficulty || 50) - (b.difficulty || 50)); }
function unlockedWords() {
  const mastered = S.progress.masteredCount || 0;
  const daily = S.progress.dailyWordCount || 3;
  return sortedWords().slice(0, mastered + daily);
}
function masteredWords() {
  const mastered = S.progress.masteredCount || 0;
  return sortedWords().slice(0, mastered);
}
function todaysBatchWords() {
  const mastered = S.progress.masteredCount || 0;
  const daily = S.progress.dailyWordCount || 3;
  return sortedWords().slice(mastered, mastered + daily);
}
function emptyStateHtml() { return `<div class="card-soft"><p class="muted small">아직 학습 가능한 단어가 없어요. 관리 탭에서 단어를 등록해보세요.</p></div>`; }

  c.innerHTML = `

    <div class="card">

/* 발음 연습: SpeechRecognition 지원되면 자동 채점, 아니면 녹음+재생 (iOS 등) */
function practicePron(wordId, reading, kanji) {
  const resultBox = document.getElementById("pron-result");
  if (SR_SUPPORTED) {
    resultBox.innerHTML = `<p class="muted small center" style="margin-top:10px;">듣고 있어요...</p>`;
    listenPronunciation(
      (alts) => {
        let best = 0;
        alts.forEach(a => { best = Math.max(best, similarity(a, reading), similarity(a, kanji)); });
        const cur = S.wordStats[wordId] || { quizAttempts: 0, quizCorrect: 0, pronAttempts: 0, pronScoreSum: 0 };
        bumpWordStat(wordId, { pronAttempts: cur.pronAttempts + 1, pronScoreSum: cur.pronScoreSum + best });
        const color = best >= 85 ? "var(--sage)" : best >= 60 ? "var(--amber)" : "var(--hanko)";
        const msg = best >= 85 ? "아주 좋아요! 발음이 정확해요 👏" : best >= 60 ? "괜찮아요! 조금만 더 또렷하게 발음해보세요." : "다시 한 번 천천히 발음해볼까요?";
        resultBox.innerHTML = `
          <div class="scorebar" style="margin-top:14px;"><div style="width:${best}%;background:${color};"></div></div>
          <p class="small center" style="color:${color};font-weight:700;margin-top:4px;">발음 정확도 ${best}%</p>

      },
      (errMsg) => { resultBox.innerHTML = `<p class="muted small center" style="margin-top:10px;">${escapeHtml(errMsg)}</p>`; }

  }
  if (!MR_SUPPORTED) {
    resultBox.innerHTML = `<p class="muted small center" style="margin-top:10px;">이 브라우저에서는 발음 연습 기능을 사용할 수 없어요.</p>`;

  }

  resultBox.innerHTML = `<p class="muted small center" style="margin-top:10px;">🔴 녹음 중... (버튼을 다시 누르면 정지)</p>`;

    (audioUrl) => {
      const cur = S.wordStats[wordId] || { quizAttempts: 0, quizCorrect: 0, pronAttempts: 0, pronScoreSum: 0 };
      bumpWordStat(wordId, { pronAttempts: cur.pronAttempts + 1 });
      resultBox.innerHTML = `
        <p class="muted small center" style="margin-top:10px;">이 브라우저(iOS Safari 등)는 자동 발음 채점을 지원하지 않아요.<br/>녹음한 내 발음과 정확한 발음을 번갈아 들으며 비교해보세요.</p>

/* =========================================================
   10. 퀴즈 (자유 퀴즈 탭 + 오늘의 학습 마무리 퀴즈 공용 로직)
========================================================= */
function computeTypingRate() {
  const ratio = (S.progress.masteredCount || 0) / (S.words.length || 1);
  if (ratio < 0.2) return 0;
  if (ratio < 0.5) return 0.3;
  return 0.65;
}
function quizTier() {
  const ratio = (S.progress.masteredCount || 0) / (S.words.length || 1);
  if (ratio < 0.2) return 1;
  if (ratio < 0.5) return 2;
  return 3;
}
function questionStem(qType, tier) {
  if (tier >= 3) return qType === "meaning" ? "この言葉の意味はどれですか？" : "この言葉の読み方はどれですか？";
  return qType === "meaning" ? "이 단어의 뜻은?" : "이 단어의 읽는 법은?";
}
/* 티어가 올라갈수록 오답 보기를 더 헷갈리게(비슷한 난이도/읽기) 고름 */
function pickDistractors(pool, target, tier, n = 3) {
  const others = pool.filter(x => x.id !== target.id);
  if (tier === 1) return shuffle(others).slice(0, n);
  const firstKana = (target.reading || "")[0];
  let candidates = others;
  if (tier === 2) {
    candidates = others.filter(w => Math.abs((w.difficulty || 50) - (target.difficulty || 50)) <= 15);
  } else {
    candidates = others.filter(w => (w.reading || "")[0] === firstKana || Math.abs((w.difficulty || 50) - (target.difficulty || 50)) <= 8);
  }
  if (candidates.length < n) candidates = others;
  return shuffle(candidates).slice(0, n);
}
/* count개 중 최소 mustIncludeWords는 반드시 한 번 이상 포함(오늘 배운 단어), 나머지는 이전 학습 단어 복습 포함 */
function buildQuiz(pool, count, mustIncludeWords) {
  const tier = quizTier();
  const typingRate = computeTypingRate();
  const deduped = Array.from(new Map((pool.length ? pool : DEFAULT_WORDS).map(w => [w.id, w])).values());
  const base = deduped;
  const must = mustIncludeWords || [];
  const picks = [...must];
  while (picks.length < count) picks.push(base[Math.floor(Math.random() * base.length)]);
  const finalPicks = shuffle(picks).slice(0, Math.max(count, must.length));
  return finalPicks.map(w => {
    const isTyping = Math.random() < typingRate;
    const qType = Math.random() > 0.5 ? "meaning" : "reading";
    if (isTyping) return { word: w, mode: "typing", qType, tier };
    const distractors = pickDistractors(base, w, tier, 3);
    return { word: w, mode: "choice", qType, tier, options: shuffle([w, ...distractors]) };
  });
}
function quizQuestionCardHtml() {
  const q = S.quiz.questions[S.quiz.idx];
  let bodyHtml = "";
  if (q.mode === "choice") {
    bodyHtml = q.options.map(opt => {
      let cls = "";
      if (S.quiz.selected) { if (opt.id === q.word.id) cls = "correct"; else if (S.quiz.selected.id === opt.id) cls = "wrong"; }
      const label = q.qType === "meaning" ? opt.meaning : opt.reading;
      return `<button class="quiz-opt ${cls}" onclick="chooseQuizOption('${opt.id}')" ${S.quiz.selected ? "disabled" : ""}>${escapeHtml(label)}</button>`;
    }).join("");
  } else {
    bodyHtml = `
      <input id="typing-input" style="width:100%;margin-top:14px;padding:10px;border:1.5px solid var(--ink);border-radius:3px;font-size:16px;"
        placeholder="${q.qType === "meaning" ? "한국어 뜻을 입력하세요" : "히라가나로 읽는 법을 입력하세요"}" ${S.quiz.selected ? "disabled" : ""} />
      <button class="btn-main" style="width:100%;margin-top:10px;" onclick="submitTyping()" ${S.quiz.selected ? "disabled" : ""}>제출</button>
    `;
  }
  return `
    <div class="rowbetween small muted" style="margin-bottom:10px;">
      <span>${S.quiz.idx + 1} / ${S.quiz.questions.length}</span><span>점수 ${S.quiz.score}</span>
    </div>
    <div class="card">
      <p class="muted small" style="font-weight:700;margin:0 0 8px;">${questionStem(q.qType, q.tier)}${q.mode === "typing" ? " (직접 입력)" : ""}</p>
      ${kanjiRowHtml(q.word.kanji, 56)}
      ${bodyHtml}
      <div id="quiz-feedback"></div>
    </div>
  `;
}
function refreshQuizUI() {
  const c = document.getElementById("tab-content");
  if (S.tab === "daily") renderDailyTab(c); else renderQuizTab(c);
}
function renderQuizTab(c) {
  const words = unlockedWords();
  if (!words.length) { c.innerHTML = emptyStateHtml(); return; }
  if (!S.quiz || S.quiz.isDaily) {
    c.innerHTML = `
      <div class="card-soft">
        <p style="font-weight:700;margin:0 0 4px;">자유 연습 퀴즈 (8문제)</p>
        <p class="muted small" style="margin:0 0 18px;">지금까지 배운 ${words.length}개 단어 중에서 무작위로 출제돼요. 오늘의 학습 완료와는 별개예요.</p>
        <button class="btn-main" onclick="startQuiz()">퀴즈 시작하기</button>
      </div>`;
    return;
  }
  if (S.quiz.idx >= S.quiz.questions.length) return renderQuizResult(c);
  c.innerHTML = quizQuestionCardHtml();
}
function startQuiz() {
  S.quiz = { questions: buildQuiz(unlockedWords(), 8), idx: 0, score: 0, selected: null, isDaily: false };
  renderQuizTab(document.getElementById("tab-content"));
}
function chooseQuizOption(optId) {
  if (S.quiz.selected) return;
  const q = S.quiz.questions[S.quiz.idx];
  const opt = q.options.find(o => o.id === optId);
  S.quiz.selected = opt;
  const correct = opt.id === q.word.id;
  if (correct) S.quiz.score++;
  const cur = S.wordStats[q.word.id] || { quizAttempts: 0, quizCorrect: 0, pronAttempts: 0, pronScoreSum: 0 };
  bumpWordStat(q.word.id, { quizAttempts: cur.quizAttempts + 1, quizCorrect: cur.quizCorrect + (correct ? 1 : 0) });
  refreshQuizUI();
  appendQuizFeedback(q);
}
function submitTyping() {
  const q = S.quiz.questions[S.quiz.idx];
  const val = document.getElementById("typing-input").value.trim();
  const target = q.qType === "meaning" ? q.word.meaning : q.word.reading;
  const score = similarity(val, target);
  const correct = score >= 80;
  S.quiz.selected = { id: correct ? q.word.id : "wrong", score };
  if (correct) S.quiz.score++;
  const cur = S.wordStats[q.word.id] || { quizAttempts: 0, quizCorrect: 0, pronAttempts: 0, pronScoreSum: 0 };
  bumpWordStat(q.word.id, { quizAttempts: cur.quizAttempts + 1, quizCorrect: cur.quizCorrect + (correct ? 1 : 0) });
  refreshQuizUI();
  appendQuizFeedback(q, correct, target);
}
function appendQuizFeedback(q, typingCorrect, typingTarget) {
  const box = document.getElementById("quiz-feedback");
  if (!box) return;
  const isLast = S.quiz.idx + 1 >= S.quiz.questions.length;
  let fb = "";
  if (typeof typingCorrect === "boolean") {
    fb = typingCorrect ? `<p style="color:var(--sage);font-weight:700;">정답이에요! ✅</p>` : `<p style="color:var(--hanko);font-weight:700;">아쉬워요. 정답: ${escapeHtml(typingTarget)}</p>`;
  }
  box.innerHTML = `
    ${fb}
    <div class="dashed-top">
      <p style="margin:0;">${escapeHtml(q.word.example || "")}</p>
      <p class="muted" style="margin:4px 0 0;">${escapeHtml(q.word.exampleKo || "")}</p>
      <button class="btn-main" style="width:100%;margin-top:12px;" onclick="nextQuizQ()">${isLast ? "결과 보기" : "다음 문제"}</button>
    </div>
  `;
}
function nextQuizQ() {
  S.quiz.idx++; S.quiz.selected = null;
  if (S.quiz.idx >= S.quiz.questions.length) {
    const pct = S.quiz.score / S.quiz.questions.length;
    markActivity({ quizPct: pct }).then(() => {
      if (S.quiz.isDaily && pct >= 0.7) completeDailySession();
    });
  }
  refreshQuizUI();
}
function renderQuizResult(c) {
  const total = S.quiz.questions.length;
  const pct = Math.round((S.quiz.score / total) * 100);
  if (S.quiz.isDaily) {
    if (pct / 100 >= 0.7) {
      c.innerHTML = `<div class="card-soft"><p style="font-size:22px;font-weight:700;margin:0;">🎉 오늘 학습 완료!</p><p class="muted" style="margin:6px 0 0;">퀴즈 정답률 ${pct}%</p></div>`;
    } else {
      c.innerHTML = `
        <div class="card-soft">
          <p style="font-size:22px;font-weight:700;margin:0;">${S.quiz.score} / ${total}</p>
          <p class="muted" style="margin:4px 0 18px;">정답률 ${pct}% (70% 이상이면 통과예요)</p>
          <button class="btn-hanko" onclick="startDailyQuiz()">다시 도전하기</button>
        </div>`;
    }
    return;
  }
  c.innerHTML = `
    <div class="card-soft">
      <p style="font-size:24px;font-weight:700;margin:0;">${S.quiz.score} / ${total}</p>
      <p class="muted" style="margin:4px 0 18px;">정답률 ${pct}%</p>
      <button class="btn-main" onclick="S.quiz=null;renderQuizTab(document.getElementById('tab-content'));">한 번 더 풀기</button>

  const box = document.getElementById("write-type-result");
  const color = correct ? "var(--sage)" : "var(--hanko)";
  box.innerHTML = `<p style="color:${color};font-weight:700;margin-top:10px;">${correct ? "정답이에요! ✅" : "다시 확인해보세요. 정답: " + escapeHtml(reading)}</p>`;
  const cur = S.wordStats[wordId] || { quizAttempts: 0, quizCorrect: 0 };
  bumpWordStat(wordId, { quizAttempts: cur.quizAttempts + 1, quizCorrect: cur.quizCorrect + (correct ? 1 : 0) });
  markActivity();
}
function writeNav(d) {
  const words = unlockedWords();
  S.studyIdx = (S.studyIdx + d + words.length) % words.length;
  renderWriteTab(document.getElementById("tab-content"));
}
function setupCanvas() {
  const canvas = document.getElementById("write-canvas");
  if (!canvas) return;
  canvasCtx = canvas.getContext("2d");
  canvasCtx.lineWidth = 6; canvasCtx.lineCap = "round"; canvasCtx.strokeStyle = "#1E2A38";
  let last = null;
  const pos = (e) => { const rect = canvas.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: p.clientX - rect.left, y: p.clientY - rect.top }; };
  const start = (e) => { drawing = true; last = pos(e); e.preventDefault(); };
  const move = (e) => { if (!drawing) return; const p = pos(e); canvasCtx.beginPath(); canvasCtx.moveTo(last.x, last.y); canvasCtx.lineTo(p.x, p.y); canvasCtx.stroke(); last = p; e.preventDefault(); };
  const end = () => { drawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearCanvas() { const canvas = document.getElementById("write-canvas"); if (canvasCtx && canvas) canvasCtx.clearRect(0, 0, canvas.width, canvas.height); }
function finishWriting(wordId, ok) {
  const cur = S.wordStats[wordId] || { quizAttempts: 0, quizCorrect: 0, pronAttempts: 0, pronScoreSum: 0, handwritingCount: 0 };
  bumpWordStat(wordId, { handwritingCount: (cur.handwritingCount || 0) + 1 });
  markActivity().then(() => toast(ok ? "잘했어요! 오늘 학습으로 기록했어요 ✍️" : "괜찮아요, 계속 연습해봐요!"));
  clearCanvas();
}

async function bulkAddRoster() {
  const isDirector = S.user.role === "director";
  const raw = document.getElementById("roster-bulk").value;
  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  const msg = document.getElementById("roster-msg");
  if (!lines.length) { msg.textContent = "입력된 내용이 없어요."; return; }
  let batch = db.batch(); let count = 0, batchCount = 0;
  for (const line of lines) {
    const parts = line.split(",").map(s => (s || "").trim());
    let empId, name, team, roleFlag;
    if (isDirector) { [empId, name, team, roleFlag] = parts; if (!empId || !name || !team) continue; }
    else { [empId, name] = parts; team = S.user.team; roleFlag = ""; if (!empId || !name) continue; }
    const role = roleFlag === "leader" ? "leader" : roleFlag === "director" ? "director" : "member";
    batch.set(db.collection("roster").doc(empId), { name, role, team, active: true }, { merge: true });
    count++; batchCount++;
    if (batchCount >= 400) { await batch.commit(); batch = db.batch(); batchCount = 0; }
  }
  if (batchCount > 0) await batch.commit();
  msg.textContent = `${count}명을 등록했어요.`;
  document.getElementById("roster-bulk").value = "";
}

async function bulkAddWords() {
  const raw = document.getElementById("word-bulk").value;
  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  const msg = document.getElementById("word-bulk-msg");
  if (!lines.length) { msg.textContent = "입력된 내용이 없어요."; return; }
  let batch = db.batch(); let count = 0, batchCount = 0;
  for (const line of lines) {
    const parts = line.split("|").map(s => (s || "").trim());
    const [kanji, reading, meaning, jlpt, difficulty, example, exampleKo] = parts;
    if (!kanji || !reading || !meaning) continue;
    const lvl = JLPT_LABELS.includes(jlpt) ? jlpt : "전문용어";
    const diff = Number(difficulty) || JLPT_DIFF[lvl] || 50;
    batch.set(db.collection("sharedWords").doc(), {
      kanji, reading, meaning, jlpt: lvl, difficulty: diff,
      example: example || "", exampleKo: exampleKo || ""
    });
    count++; batchCount++;
    if (batchCount >= 400) { await batch.commit(); batch = db.batch(); batchCount = 0; }
  }
  if (batchCount > 0) await batch.commit();
  msg.textContent = `${count}개의 단어를 등록했어요.`;
  document.getElementById("word-bulk").value = "";
}

}
function updateWordJlpt(id, jlpt) { db.collection("sharedWords").doc(id).set({ jlpt }, { merge: true }); }
function updateWordDifficulty(id, difficulty) { db.collection("sharedWords").doc(id).set({ difficulty: Number(difficulty) || 50 }, { merge: true }); }
function deleteSharedWord(id) { db.collection("sharedWords").doc(id).delete(); }
</script>
